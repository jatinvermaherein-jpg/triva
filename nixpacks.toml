# Railway builds this with Nixpacks. Two deliberate choices:
#   1. No `cache` phase. That phase copies the project directory - which is where a
#      dev-run hub.db sits - so a stray SQLite file would be baked into the image and
#      resurrect itself on the next deploy. `.dockerignore` is the belt to these braces:
#      Railway honours THAT file, not .railwayignore (undocumented, CLI-only).
#   2. start is our own command, not uvicorn-serve (this is a Discord worker, not ASGI).
schemaVersion = "1"

[providers]
python = "3.13"

[phases.install]
cmds = ["pip install --no-cache-dir -r requirements.txt"]
# No build phase: a build-time `python bot/main.py ...` would open the default
# ./hub.db (no volume exists yet) and bake an empty database into the image. That
# file then wins over the mount on some start orders, and the season is quietly
# replaced by a blank one. Nothing should touch SQLite except the running process.

[start]
cmd = "python bot/main.py"

[variables]
PYTHONUNBUFFERED = "1"
